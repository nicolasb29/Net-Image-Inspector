<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Images Réseau</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f4f4f9;
      box-sizing: border-box;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #count {
      font-size: 12px;
      background: #007bff;
      color: white;
      padding: 2px 6px;
      border-radius: 10px;
    }
    #clear-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    #clear-btn:hover {
      background: #c82333;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 colonnes pour un panneau latéral */
      gap: 8px;
    }
    @media (min-width: 300px) {
      #gallery {
        grid-template-columns: repeat(3, 1fr); /* S'élargit si on agrandit le panneau */
      }
    }
    .image-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }
    .image-card:hover {
      border-color: #007bff;
      transform: translateY(-2px);
    }
    .image-card img {
      max-width: 100%;
      height: 70px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .image-url {
      font-size: 9px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>
    <span>Images détectées</span>
    <div class="header-actions">
      <span id="count">0</span>
      <button id="clear-btn">Purger</button>
    </div>
  </h3>
  <div id="gallery"></div>

  <script src="popup.js"></script>
</body>
</html>
